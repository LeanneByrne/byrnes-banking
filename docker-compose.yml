services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: byrnes_banking
      POSTGRES_USER: ${DB_USERNAME:-byrnes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-byrnes}
    ports:
      - "5432:5432"
    volumes:
      - byrnes-banking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-byrnes} -d byrnes_banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker -- no separate ZooKeeper container needed;
  # modern Kafka (4.x) dropped ZooKeeper entirely in favor of its own
  # built-in consensus protocol, even for a single broker like this one.
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Scrapes the app's /actuator/prometheus endpoint on the HOST (the app
  # itself runs via `./mvnw spring-boot:run`, not in this compose file) --
  # host.docker.internal is Docker Desktop's resolvable alias for that;
  # extra_hosts below adds the same alias on Linux, where it isn't automatic.
  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  byrnes-banking-pgdata:
