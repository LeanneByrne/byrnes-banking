spring:
  application:
    name: byrnes-banking
  datasource:
    url: jdbc:postgresql://localhost:5432/byrnes_banking
    username: ${DB_USERNAME:byrnes}
    password: ${DB_PASSWORD:byrnes}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        # /health stays public (see SecurityConfig) for load-balancer-style
        # probes; everything else here is operational detail an unauthenticated
        # caller shouldn't see, so it's locked to ADMIN at the filter-chain level.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        transfers.duration: true
  tracing:
    sampling:
      # 100% sampling is fine at this traffic volume; a real high-throughput
      # service would sample a fraction to control tracing backend cost.
      probability: 1.0

logging:
  structured:
    format:
      console: ecs

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-value-before-any-real-deployment}
    expiration-minutes: 60
