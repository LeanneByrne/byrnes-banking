name: Deploy to AWS

# Manual only -- this workflow deploys to real, billable infrastructure.
# Automatically deploying on every push to main would mean every commit
# costs money and redeploys a demo environment nobody asked to redeploy;
# a human explicitly choosing to deploy is the right trigger here, not a
# push event. See ADR 0013 for why OIDC is used instead of stored AWS keys.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REPOSITORY: ${{ steps.ecr-login.outputs.registry }}/${{ vars.PROJECT_NAME }}
        run: |
          docker build -t "$REPOSITORY:${{ github.sha }}" -t "$REPOSITORY:latest" .
          docker push "$REPOSITORY:${{ github.sha }}"
          docker push "$REPOSITORY:latest"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.PROJECT_NAME }}" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.PROJECT_NAME }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          wait-for-service-stability: true

  deploy-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Baked in at build time, not read at runtime -- Vite inlines
          # import.meta.env.* values into the bundle during `vite build`,
          # so this has to be set here, not as a container env var later.
          VITE_API_BASE_URL: ${{ vars.BACKEND_API_URL }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
